<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">How ListFast works</title>
  <desc id="d">Four steps: snap a photo, AI identifies the item, AI writes the listing, save it to your local ledger.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00A8E8"/><stop offset="1" stop-color="#0052D4"/></linearGradient>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#0052D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="22" fill="#fff" stroke="#d8e1ec" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <!-- 1 -->
    <rect x="40" y="50" width="240" height="200" rx="16" fill="#f4f7fb" stroke="#d8e1ec"/>
    <circle cx="160" cy="95" r="22" fill="url(#g)"/><text x="160" y="103" font-size="22" font-weight="800" fill="#fff">1</text>
    <text x="160" y="150" font-size="24" font-weight="800" fill="#0D253C">Snap</text>
    <text x="160" y="180" font-size="15" fill="#5a6b80">Take a photo or pick</text>
    <text x="160" y="201" font-size="15" fill="#5a6b80">one from your gallery</text>
    <!-- 2 -->
    <rect x="340" y="50" width="240" height="200" rx="16" fill="#f4f7fb" stroke="#d8e1ec"/>
    <circle cx="460" cy="95" r="22" fill="url(#g)"/><text x="460" y="103" font-size="22" font-weight="800" fill="#fff">2</text>
    <text x="460" y="150" font-size="24" font-weight="800" fill="#0D253C">Identify</text>
    <text x="460" y="180" font-size="15" fill="#5a6b80">Brand, model, condition</text>
    <text x="460" y="201" font-size="15" fill="#5a6b80">and specs from the photo</text>
    <text x="460" y="230" font-size="12" font-weight="700" fill="#0052D4" letter-spacing="1">GROQ VISION</text>
    <!-- 3 -->
    <rect x="640" y="50" width="240" height="200" rx="16" fill="#f4f7fb" stroke="#d8e1ec"/>
    <circle cx="760" cy="95" r="22" fill="url(#g)"/><text x="760" y="103" font-size="22" font-weight="800" fill="#fff">3</text>
    <text x="760" y="150" font-size="24" font-weight="800" fill="#0D253C">Write</text>
    <text x="760" y="180" font-size="15" fill="#5a6b80">Title and description,</text>
    <text x="760" y="201" font-size="15" fill="#5a6b80">edit, then copy</text>
    <text x="760" y="230" font-size="12" font-weight="700" fill="#0052D4" letter-spacing="1">GROQ TEXT</text>
    <!-- 4 -->
    <rect x="940" y="50" width="220" height="200" rx="16" fill="#f4f7fb" stroke="#d8e1ec"/>
    <circle cx="1050" cy="95" r="22" fill="url(#g)"/><text x="1050" y="103" font-size="22" font-weight="800" fill="#fff">4</text>
    <text x="1050" y="150" font-size="24" font-weight="800" fill="#0D253C">Track</text>
    <text x="1050" y="180" font-size="15" fill="#5a6b80">Ledger, sold price</text>
    <text x="1050" y="201" font-size="15" fill="#5a6b80">and profit</text>
    <text x="1050" y="230" font-size="12" font-weight="700" fill="#0E8077" letter-spacing="1">STAYS ON YOUR DEVICE</text>
  </g>
  <g fill="none" stroke="#0052D4" stroke-width="2.5" stroke-linecap="round">
    <path d="M286 150 H328" marker-end="url(#ar)"/><path d="M586 150 H628" marker-end="url(#ar)"/><path d="M886 150 H928" marker-end="url(#ar)"/>
  </g>
</svg>
